name: CI

# Type check, lint, unit tests, the UI guards and the database tests (in-process Postgres, no Docker needed)
# once a pull request is merged into main (a direct push to main does not run it).
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run check:ui
      - run: npm run test:db
